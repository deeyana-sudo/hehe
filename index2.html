<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffd6e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* =========================
           PASSWORD SCREEN
        ========================= */

        #passwordScreen {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(255, 100, 150, 0.25);
            z-index: 10;
        }

        #passwordScreen h2 {
            color: #8b2a4a;
            font-size: 25px;
            margin-bottom: 12px;
        }

        #passwordScreen p {
            color: #999;
            font-size: 15px;
            margin-bottom: 22px;
        }

        #passwordInput {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffc1d1;
            border-radius: 10px;
            outline: none;
            font-size: 17px;
            text-align: center;
        }

        #passwordInput:focus {
            border-color: #ff6f91;
        }

        #openBtn {
            margin-top: 15px;
            padding: 13px 35px;
            background: #ff4d79;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        #openBtn:hover {
            background: #e83e69;
            transform: scale(1.05);
        }

        #wrongPassword {
            display: none;
            color: #ff3b5c;
            margin-top: 15px;
            font-size: 14px;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .card {
            display: none;
            background: white;
            width: 90%;
            max-width: 430px;
            padding: 40px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(255, 100, 150, 0.2);
            position: relative;
            z-index: 10;
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .question {
            font-size: 30px;
            color: #8b2a4a;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .character {
            font-size: 80px;
            margin-bottom: 35px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* =========================
           BUTTONS
        ========================= */

        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            min-height: 70px;
            position: relative;
        }

        .yes-btn {
            padding: 14px 40px;
            background: #28c75c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .yes-btn:hover {
            background: #20b653;
        }

        /* RED CHOICE BUTTON */

        .no-btn {
            padding: 14px 25px;
            background: #ff3b5c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1;
        }

        .no-btn:hover {
            background: #e82f4e;
        }


        /* =========================
           SUCCESS SCREEN
        ========================= */

        #success {
            display: none;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            padding: 20px;
            z-index: 10;
        }

        .success-text {
            font-size: 38px;
            color: #ff3b5c;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .sub-text {
            font-size: 20px;
            color: #8b2a4a;
            line-height: 1.6;
        }


        /* =========================
           HEART CONFETTI
        ========================= */

        .heart {
            position: absolute;
            color: #ff3b5c;
            font-size: 20px;
            animation: fall 4s ease-in-out forwards;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .question {
                font-size: 27px;
            }

            .character {
                font-size: 70px;
            }

            .yes-btn {
                padding: 13px 30px;
                font-size: 18px;
            }

            .no-btn {
                padding: 13px 20px;
                font-size: 15px;
            }

            .success-text {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>


    <!-- =========================
         PASSWORD SCREEN
    ========================= -->

    <div id="passwordScreen">

        <h2>Your nickname that only me can call 🤭❤️</h2>

        <p>Enter the secret nickname to continue...</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter nickname..."
        >

        <br>

        <button id="openBtn" onclick="checkPassword()">
            Open ❤️
        </button>

        <div id="wrongPassword">
            Hmm... that's not it 🥺 Try again!
        </div>

    </div>


    <!-- =========================
         MAIN QUESTION
    ========================= -->

    <div class="card" id="mainCard">

        <h1 class="question">
            Do you love me? ❤️
        </h1>

        <div class="character">
            🥺
        </div>

        <div class="btn-group">

            <button
                class="yes-btn"
                id="yesBtn"
                onclick="showSuccess()">
                Yes ❤️
            </button>

            <button
                class="no-btn"
                id="noBtn"
                onclick="changeChoice()">
                No
            </button>

        </div>

    </div>


    <!-- =========================
         SUCCESS SCREEN
    ========================= -->

    <div id="success">

        <div class="success-text">
            I knew it! ❤️
        </div>

        <p class="sub-text">
            You made the right choice! 🥰<br>
            I love you so much ❤️
        </p>

    </div>


    <script>

        /* =========================
           PASSWORD
        ========================= */

        const CORRECT_PASSWORD = "haowee";

        function checkPassword() {

            const input =
                document.getElementById("passwordInput").value;

            const passwordScreen =
                document.getElementById("passwordScreen");

            const mainCard =
                document.getElementById("mainCard");

            const wrongPassword =
                document.getElementById("wrongPassword");

            if (input.toLowerCase() === CORRECT_PASSWORD) {

                passwordScreen.style.display = "none";

                mainCard.style.display = "block";

            } else {

                wrongPassword.style.display = "block";

                document.getElementById("passwordInput").value = "";

            }
        }


        /* Allow ENTER key for password */

        document.getElementById("passwordInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    checkPassword();
                }

            });


        /* =========================
           RED BUTTON CHOICES
        ========================= */

        const choices = [

            "No",

            "Are you sure? 🥺",

            "Really sure?",

            "Think again! 😭",

            "Please don't say no 🥺",

            "Give me a chance ❤️",

            "But I love you! 🥹",

            "You can't say no 😭",

            "One more chance?",

            "Pretty please? 🥺",

            "Don't break my heart 💔",

            "Are you REALLY sure?",

            "I might cry... 😭",

            "Just say yes ❤️",

            "You know you love me 😌",

            "Pleaseeeeee 🥺❤️"

        ];

        let choiceIndex = 0;

        let yesScale = 1;


        function changeChoice() {

            const noBtn =
                document.getElementById("noBtn");

            const yesBtn =
                document.getElementById("yesBtn");


            /* Change red button text */

            choiceIndex++;

            if (choiceIndex >= choices.length) {
                choiceIndex = 1;
            }

            noBtn.innerText = choices[choiceIndex];


            /* Make YES button slightly bigger */

            yesScale += 0.08;

            if (yesScale > 1.7) {
                yesScale = 1.7;
            }

            yesBtn.style.transform =
                `scale(${yesScale})`;


            /* Create a little heart */

            createSmallHeart();

        }


        /* =========================
           SMALL HEART EFFECT
        ========================= */

        function createSmallHeart() {

            const heart =
                document.createElement("div");

            heart.classList.add("heart");

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "%";

            heart.style.top =
                Math.random() * 50 + "%";

            heart.style.fontSize =
                (15 + Math.random() * 20) + "px";

            document.body.appendChild(heart);

            setTimeout(function() {
                heart.remove();
            }, 4000);

        }


        /* =========================
           YES BUTTON
        ========================= */

        function showSuccess() {

            const mainCard =
                document.getElementById("mainCard");

            const success =
                document.getElementById("success");

            mainCard.style.display = "none";

            success.style.display = "block";

            createHearts();

        }


        /* =========================
           HEART CONFETTI
        ========================= */

        function createHearts() {

            for (let i = 0; i < 60; i++) {

                let heart =
                    document.createElement("div");

                heart.classList.add("heart");

                heart.innerHTML = "❤️";

                heart.style.left =
                    Math.random() * 100 + "%";

                heart.style.animationDelay =
                    Math.random() * 3 + "s";

                heart.style.fontSize =
                    (15 + Math.random() * 25) + "px";

                document.body.appendChild(heart);

            }

        }

    </script>

</body>
</html>
